# The full check (scripts/check.sh full, see docs/PORTING.md "Checks") on every push to main and every pull request.
# The generated files the tests need (data/, fixtures/generated/, the assembler module) are not in git: they come from the
# asset of a GitHub release, recorded in ci/data-asset.txt (made with ci/make-data-asset.sh; see docs/PORTING.md "CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: never
  WUICA_SCCACHE: "0"

jobs:
  check:
    name: check full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc -V

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/wuica/package-lock.json

      - name: Tools
        run: |
          set -x
          node -v
          clang --version
          clang --print-targets | grep wasm32
          command -v llvm-ar || ls -l "$(dirname "$(readlink -f "$(command -v clang)")")/llvm-ar"
          google-chrome --version
          nproc

      - name: Data asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get() { sed -n "s/^$1=//p" ci/data-asset.txt; }
          tag="$(get tag)"; file="$(get file)"; sum="$(get sha256)"
          dir="$RUNNER_TEMP/ci-data"
          mkdir -p "$dir/unpacked"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$dir"
          echo "$sum  $dir/$file" | sha256sum -c -
          tar -C "$dir/unpacked" -xJf "$dir/$file"
          (cd "$dir/unpacked" && sha256sum -c --quiet MANIFEST.txt)
          mkdir -p fixtures assembler/dist mca/dist
          mv "$dir/unpacked/data" data
          mv "$dir/unpacked/fixtures/generated" fixtures/generated
          mv "$dir/unpacked/assembler/dist/wuica_asm.wasm" assembler/dist/
          # llvm-mca (from ci-data-v6 on)
          if [ -f "$dir/unpacked/mca/dist/wuica_mca.wasm" ]; then mv "$dir/unpacked/mca/dist/wuica_mca.wasm" mca/dist/; fi
          rm -rf "$dir"
          echo "$tag: $(get files) files"

      - name: npm ci (packages/wuica)
        working-directory: packages/wuica
        run: npm ci --no-audit --no-fund

      - name: scripts/check.sh full
        run: |
          # the table goes to the job summary from check.mjs ($GITHUB_STEP_SUMMARY); if it stopped before, the tail of its output
          mkdir -p target/check
          set +e
          scripts/check.sh full --jobs "$(nproc)" --chrome-jobs 1 --no-skip 2>&1 | tee target/check/output.txt
          status="${PIPESTATUS[0]}"
          if ! grep -Eq '^check full: (ok|FAILED)' target/check/output.txt; then
            { echo '### check full did not finish'; echo '```'; tail -n 60 target/check/output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: |
            target/check/*.log
            target/check/output.txt
          if-no-files-found: ignore
          retention-days: 14
