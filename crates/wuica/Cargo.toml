[package]
name = "wuica"
description = "wuica (WebAssembly uiCA): throughput prediction for x86-64 basic blocks; a port of uiCA. Decoder + core."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the JSON instruction-table loader (Engine::load_arch): for the native tools and tests; the WebAssembly module that ships
# reads only the binary tables (crates/wuica-wasm turns it off)
default = ["json-tables"]
json-tables = []

[dependencies]
wuica-core = { path = "../wuica-core" }
wuica-xed = { path = "../wuica-xed" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
wuica-testkit = { path = "../wuica-testkit" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
