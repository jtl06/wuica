[package]
name = "wuica-core"
description = "The core of wuica: data model, instruction builder and pipeline simulator (a port of uiCA; pure Rust, no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
wuica-testkit = { path = "../wuica-testkit" }
flate2 = "1"
