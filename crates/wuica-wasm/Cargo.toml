[package]
name = "wuica-wasm"
description = "WebAssembly interface of wuica (plain exports; see docs/WASM-API.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# the JSON instruction-table loader in wuica_load_arch (off: the module that ships reads only binary tables)
json-tables = ["wuica/json-tables"]

[dependencies]
wuica = { path = "../wuica", default-features = false }
wuica-xed = { path = "../wuica-xed" }
