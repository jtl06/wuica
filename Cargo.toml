[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = true

# for iterating on performance work: release code without LTO, quicker to rebuild
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
